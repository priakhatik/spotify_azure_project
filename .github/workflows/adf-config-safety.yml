name: ADF configuration safety
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-adf-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check JSON and signed-webhook handling
        run: python -m unittest discover -s tests -v
